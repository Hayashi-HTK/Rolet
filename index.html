<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Roleta Adam">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Roleta Adam</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#1a1a2e;color:#eee;min-height:100vh;padding-bottom:2rem;}
.header{background:linear-gradient(135deg,#16213e,#0f3460);padding:1rem 1.2rem 0.8rem;display:flex;align-items:center;gap:10px;box-shadow:0 2px 12px rgba(0,0,0,0.4);position:sticky;top:0;z-index:10;}
.header-icon{font-size:24px;}
.header-title{font-size:18px;font-weight:700;color:#fff;}
.header-sub{font-size:11px;color:#aaa;margin-top:1px;}
.container{padding:1rem;}
.card{background:#16213e;border-radius:14px;padding:1rem;margin-bottom:1rem;border:1px solid #0f3460;}
.card-title{font-size:12px;color:#888;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px;}
.input-group{margin-bottom:10px;}
label{font-size:12px;color:#aaa;display:block;margin-bottom:4px;}
input{width:100%;padding:10px 12px;background:#0f3460;border:1px solid #1a4080;border-radius:10px;color:#fff;font-size:14px;outline:none;-webkit-appearance:none;}
input:focus{border-color:#3B82F6;}
.row{display:flex;gap:10px;}
.row .input-group{flex:1;}
.btn-primary{width:100%;padding:13px;background:linear-gradient(135deg,#3B82F6,#2563EB);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:8px;box-shadow:0 4px 15px rgba(59,130,246,0.4);-webkit-tap-highlight-color:transparent;}
.btn-secondary{width:100%;padding:10px;background:#0f3460;border:1px solid #1a4080;border-radius:12px;color:#aaa;font-size:13px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1rem;}
.stat{background:#16213e;border-radius:12px;padding:10px;text-align:center;border:1px solid #0f3460;}
.stat-l{font-size:10px;color:#888;margin-bottom:3px;}
.stat-v{font-size:17px;font-weight:700;color:#fff;}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:1rem;}
.li{display:flex;align-items:center;gap:5px;font-size:11px;color:#aaa;}
.ld{width:12px;height:12px;border-radius:3px;flex-shrink:0;}
canvas{width:100%!important;height:auto!important;border-radius:12px;display:block;}
.aposta{background:#16213e;border-radius:14px;padding:1rem;margin-top:1rem;border:1px solid #0f3460;}
.aposta-title{font-size:14px;font-weight:700;color:#fff;margin-bottom:10px;}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 10px;}
.chip{padding:4px 11px;border-radius:20px;font-size:12px;font-weight:700;color:#fff;}
.ch{background:#E24B4A;}.cn{background:#EF9F27;}.cm{background:#3B82F6;}.cmn{background:#7C3AED;}
.sec-t{font-size:11px;color:#888;margin:8px 0 3px;text-transform:uppercase;letter-spacing:.4px;}
.total-box{background:#0f3460;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:13px;color:#aaa;line-height:1.7;}
.total-box strong{color:#fff;}
.tip{font-size:11px;color:#666;margin-top:4px;}
.info-box{background:#0f3460;border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:12px;color:#888;line-height:1.6;}
.info-box strong{color:#aaa;}
@supports(padding-bottom:env(safe-area-inset-bottom)){body{padding-bottom:calc(2rem + env(safe-area-inset-bottom));}}
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">🎰</div>
  <div>
    <div class="header-title">Roleta Adam</div>
    <div class="header-sub">Cluster principal • Espelho • Alta precisão</div>
  </div>
</div>

<div class="container">

  <div class="card">
    <div class="card-title">Configuração</div>
    <div class="input-group">
      <label>Histórico (últimos números)</label>
      <input id="hist" type="text" value="32, 32, 26, 7, 18, 20, 5" placeholder="ex: 32, 26, 7, 18, 5">
    </div>
    <div class="row">
      <div class="input-group">
        <label>Vizinhos</label>
        <input id="nbrs" type="number" value="2" min="1" max="4">
        <div class="tip">de cada lado</div>
      </div>
      <div class="input-group">
        <label>Raio mínimo cluster</label>
        <input id="minc" type="number" value="2" min="1" max="5">
        <div class="tip">para ativar</div>
      </div>
    </div>
    <button class="btn-primary" onclick="render()">🔍 Analisar</button>
    <button class="btn-secondary" onclick="limpar()">Limpar</button>
  </div>

  <div class="stats" id="stats"></div>

  <div class="legend">
    <div class="li"><div class="ld" style="background:#E24B4A;"></div>Cluster principal</div>
    <div class="li"><div class="ld" style="background:#EF9F27;"></div>Vizinhos cluster</div>
    <div class="li"><div class="ld" style="background:#3B82F6;"></div>Espelho</div>
    <div class="li"><div class="ld" style="background:#7C3AED;"></div>Vizinhos espelho</div>
    <div class="li"><div class="ld" style="background:#444;"></div>Ignorado</div>
    <div class="li"><div class="ld" style="background:#1D9E75;"></div>Zero</div>
  </div>

  <canvas id="c"></canvas>

  <div class="aposta" id="aposta"></div>

</div>

<script src="app.js"></script>
</body>
</html>

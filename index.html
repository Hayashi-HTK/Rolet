<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Roleta Adam">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Roleta Adam</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:#1a1a2e;
  color:#eee;
  min-height:100vh;
  padding-bottom:2rem;
}
.header{
  background:linear-gradient(135deg,#16213e,#0f3460);
  padding:1rem 1.2rem 0.8rem;
  display:flex;align-items:center;gap:10px;
  box-shadow:0 2px 12px rgba(0,0,0,0.4);
  position:sticky;top:0;z-index:10;
}
.header-icon{font-size:24px;}
.header-title{font-size:18px;font-weight:700;color:#fff;}
.header-sub{font-size:11px;color:#aaa;margin-top:1px;}

.container{padding:1rem;}

.card{
  background:#16213e;
  border-radius:14px;
  padding:1rem;
  margin-bottom:1rem;
  border:1px solid #0f3460;
}
.card-title{font-size:12px;color:#888;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px;}

.input-group{margin-bottom:10px;}
label{font-size:12px;color:#aaa;display:block;margin-bottom:4px;}
input{
  width:100%;padding:10px 12px;
  background:#0f3460;border:1px solid #1a4080;
  border-radius:10px;color:#fff;font-size:14px;
  outline:none;-webkit-appearance:none;
}
input:focus{border-color:#3B82F6;}

.row{display:flex;gap:10px;}
.row .input-group{flex:1;}

.btn-primary{
  width:100%;padding:13px;
  background:linear-gradient(135deg,#3B82F6,#2563EB);
  border:none;border-radius:12px;
  color:#fff;font-size:15px;font-weight:700;
  cursor:pointer;margin-bottom:8px;
  box-shadow:0 4px 15px rgba(59,130,246,0.4);
  -webkit-tap-highlight-color:transparent;
}
.btn-secondary{
  width:100%;padding:10px;
  background:#0f3460;border:1px solid #1a4080;
  border-radius:12px;color:#aaa;font-size:13px;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1rem;}
.stat{background:#16213e;border-radius:12px;padding:10px;text-align:center;border:1px solid #0f3460;}
.stat-l{font-size:10px;color:#888;margin-bottom:3px;}
.stat-v{font-size:17px;font-weight:700;color:#fff;}

.legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:1rem;}
.li{display:flex;align-items:center;gap:5px;font-size:11px;color:#aaa;}
.ld{width:12px;height:12px;border-radius:3px;flex-shrink:0;}

canvas{width:100%!important;height:auto!important;border-radius:12px;display:block;}

.aposta{
  background:#16213e;border-radius:14px;
  padding:1rem;margin-top:1rem;
  border:1px solid #0f3460;
}
.aposta-title{font-size:14px;font-weight:700;color:#fff;margin-bottom:10px;}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 10px;}
.chip{padding:4px 11px;border-radius:20px;font-size:12px;font-weight:700;color:#fff;}
.ch{background:#E24B4A;}.cn{background:#EF9F27;}.cm{background:#3B82F6;}.cmn{background:#7C3AED;}
.sec-t{font-size:11px;color:#888;margin:8px 0 3px;text-transform:uppercase;letter-spacing:.4px;}
.total-box{
  background:#0f3460;border-radius:10px;padding:10px 12px;
  margin-top:10px;font-size:13px;color:#aaa;line-height:1.7;
}
.total-box strong{color:#fff;}

.tip{font-size:11px;color:#666;margin-top:4px;}

/* iOS safe area */
@supports(padding-bottom:env(safe-area-inset-bottom)){
  body{padding-bottom:calc(2rem + env(safe-area-inset-bottom));}
}
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">🎰</div>
  <div>
    <div class="header-title">Roleta Adam</div>
    <div class="header-sub">Análise de cilindro • Clusters • Espelhos</div>
  </div>
</div>

<div class="container">

  <div class="card">
    <div class="card-title">Configuração</div>
    <div class="input-group">
      <label>Histórico (últimos números)</label>
      <input id="hist" type="text" value="32, 32, 26, 7, 18, 20, 5" placeholder="ex: 32, 26, 7, 18, 5">
    </div>
    <div class="row">
      <div class="input-group">
        <label>Vizinhos</label>
        <input id="nbrs" type="number" value="2" min="1" max="5">
        <div class="tip">de cada lado</div>
      </div>
      <div class="input-group">
        <label>Raio mínimo</label>
        <input id="minc" type="number" value="2" min="1" max="5">
        <div class="tip">para ativar cluster</div>
      </div>
    </div>
    <button class="btn-primary" onclick="render()">🔍 Analisar</button>
    <button class="btn-secondary" onclick="limpar()">Limpar</button>
  </div>

  <div class="stats" id="stats"></div>

  <div class="legend">
    <div class="li"><div class="ld" style="background:#E24B4A;"></div>Quente</div>
    <div class="li"><div class="ld" style="background:#EF9F27;"></div>Viz. cluster</div>
    <div class="li"><div class="ld" style="background:#3B82F6;"></div>Espelho</div>
    <div class="li"><div class="ld" style="background:#7C3AED;"></div>Viz. espelho</div>
    <div class="li"><div class="ld" style="background:#888;"></div>Isolado</div>
    <div class="li"><div class="ld" style="background:#1D9E75;"></div>Zero</div>
  </div>

  <canvas id="c"></canvas>

  <div class="aposta" id="aposta"></div>

</div>

<script>
var WHEEL=[0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
var RED=[1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
var N=37;

function parse(s){
  return s.split(/[\s,]+/).map(function(v){return parseInt(v.trim());}).filter(function(n){return !isNaN(n)&&n>=0&&n<=36;});
}

function findClusters(hotIdx,minC){
  var visited={};var clusters=[];
  var arr=[];hotIdx.forEach(function(i){arr.push(i);});
  arr.sort(function(a,b){return a-b;});
  arr.forEach(function(i){
    if(visited[i])return;
    var cluster=[i];visited[i]=true;
    var j=(i+1)%N;
    while(hotIdx.has(j)&&!visited[j]){cluster.push(j);visited[j]=true;j=(j+1)%N;}
    clusters.push(cluster);
  });
  return clusters.filter(function(c){return c.length>=minC;});
}

function getMirrors(clusterIdx){
  var mirrors=new Set();
  clusterIdx.forEach(function(i){
    [18,19].forEach(function(offset){
      var mi=(i+offset)%N;
      if(!clusterIdx.has(mi))mirrors.add(mi);
    });
  });
  return mirrors;
}

function render(){
  var hist=parse(document.getElementById('hist').value);
  var nbrCount=Math.max(1,Math.min(5,parseInt(document.getElementById('nbrs').value)||2));
  var minC=Math.max(1,parseInt(document.getElementById('minc').value)||2);

  var freq={};WHEEL.forEach(function(n){freq[n]=0;});
  hist.forEach(function(n){if(freq[n]!==undefined)freq[n]++;});

  var hotIdx=new Set();
  WHEEL.forEach(function(n,i){if(freq[n]>0)hotIdx.add(i);});

  var clusters=findClusters(hotIdx,minC);
  var clusterIdx=new Set();
  clusters.forEach(function(c){c.forEach(function(i){clusterIdx.add(i);});});

  var isolatedIdx=new Set();
  hotIdx.forEach(function(i){if(!clusterIdx.has(i))isolatedIdx.add(i);});

  var nbrIdx=new Set();
  clusterIdx.forEach(function(i){
    for(var d=-nbrCount;d<=nbrCount;d++){
      var ni=(i+d+N)%N;
      if(!clusterIdx.has(ni))nbrIdx.add(ni);
    }
  });

  var mirrorIdx=getMirrors(clusterIdx);
  mirrorIdx.forEach(function(i){if(nbrIdx.has(i))nbrIdx.delete(i);});

  var mirNbrIdx=new Set();
  mirrorIdx.forEach(function(i){
    for(var d=-nbrCount;d<=nbrCount;d++){
      var ni=(i+d+N)%N;
      if(!clusterIdx.has(ni)&&!nbrIdx.has(ni)&&!mirrorIdx.has(ni))mirNbrIdx.add(ni);
    }
  });

  drawWheel(clusterIdx,isolatedIdx,nbrIdx,mirrorIdx,mirNbrIdx);
  buildStats(hist,clusterIdx,nbrIdx,mirrorIdx,mirNbrIdx);
  buildAposta(clusterIdx,nbrIdx,mirrorIdx,mirNbrIdx,isolatedIdx,minC);
}

function drawWheel(clusterIdx,isolatedIdx,nbrIdx,mirrorIdx,mirNbrIdx){
  var canvas=document.getElementById('c');
  var W=660,H=340;
  canvas.width=W;canvas.height=H;
  var ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,W,H);
  var cx=W/2,cy=H/2;
  var rx=W/2-30,ry=H/2-30;
  var cellAngle=(2*Math.PI)/N;
  var halfCell=cellAngle/2;

  function ep(a,rX,rY){return{x:cx+rX*Math.cos(a),y:cy+rY*Math.sin(a)};}

  function drawCell(i,fill,stroke){
    var a1=-Math.PI/2+(i*cellAngle)-halfCell,a2=a1+cellAngle;
    var oX=rx,oY=ry,iX=rx*0.68,iY=ry*0.68;
    ctx.beginPath();
    for(var a=a1;a<=a2;a+=0.02){var p=ep(a,oX,oY);if(a===a1)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);}
    var pe=ep(a2,oX,oY);ctx.lineTo(pe.x,pe.y);
    for(var a=a2;a>=a1;a-=0.02){var p=ep(a,iX,iY);ctx.lineTo(p.x,p.y);}
    var pi2=ep(a1,iX,iY);ctx.lineTo(pi2.x,pi2.y);
    ctx.closePath();
    ctx.fillStyle=fill;ctx.fill();
    ctx.strokeStyle=stroke;ctx.lineWidth=0.8;ctx.stroke();
  }

  function drawNum(i){
    var aMid=-Math.PI/2+(i*cellAngle);
    var p=ep(aMid,rx*0.83,ry*0.83);
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(aMid+Math.PI/2);
    ctx.font='600 11px sans-serif';ctx.fillStyle='#fff';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(String(WHEEL[i]),0,0);ctx.restore();
  }

  WHEEL.forEach(function(num,i){
    var fill,stroke;
    if(num===0){fill='#1D9E75';stroke='#0F6E56';}
    else if(clusterIdx.has(i)){fill='#E24B4A';stroke='#A32D2D';}
    else if(isolatedIdx.has(i)){fill='#555';stroke='#444';}
    else if(mirrorIdx.has(i)){fill='#3B82F6';stroke='#1D4ED8';}
    else if(nbrIdx.has(i)){fill='#EF9F27';stroke='#BA7517';}
    else if(mirNbrIdx.has(i)){fill='#7C3AED';stroke='#5B21B6';}
    else if(RED.indexOf(num)>=0){fill='#8B2020';stroke='#6B1818';}
    else{fill='#1a1a2e';stroke='#2a2a4e';}
    drawCell(i,fill,stroke);
    drawNum(i);
  });

  var iX=rx*0.68,iY=ry*0.68;
  ctx.beginPath();
  for(var a=0;a<=2*Math.PI;a+=0.02){var p=ep(a,iX,iY);if(a===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);}
  ctx.closePath();
  ctx.fillStyle='#16213e';ctx.fill();
  ctx.strokeStyle='#0f3460';ctx.lineWidth=1.5;ctx.stroke();
  ctx.font='700 13px sans-serif';ctx.fillStyle='#aaa';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('Roleta Europeia',cx,cy-10);
  ctx.font='400 11px sans-serif';ctx.fillStyle='#666';
  ctx.fillText('37 números',cx,cy+10);
}

function buildStats(hist,clusterIdx,nbrIdx,mirrorIdx,mirNbrIdx){
  var all=new Set();
  clusterIdx.forEach(function(i){all.add(i);});
  nbrIdx.forEach(function(i){all.add(i);});
  mirrorIdx.forEach(function(i){all.add(i);});
  mirNbrIdx.forEach(function(i){all.add(i);});
  var pct=((all.size/37)*100).toFixed(1);
  document.getElementById('stats').innerHTML=
    '<div class="stat"><div class="stat-l">Rodadas</div><div class="stat-v">'+hist.length+'</div></div>'+
    '<div class="stat"><div class="stat-l">Zona quente</div><div class="stat-v">'+clusterIdx.size+'</div></div>'+
    '<div class="stat"><div class="stat-l">Espelhos</div><div class="stat-v">'+mirrorIdx.size+'</div></div>'+
    '<div class="stat"><div class="stat-l">A apostar</div><div class="stat-v">'+all.size+'</div></div>'+
    '<div class="stat"><div class="stat-l">Cobertura</div><div class="stat-v">'+pct+'%</div></div>'+
    '<div class="stat"><div class="stat-l">Clusters</div><div class="stat-v">'+Math.max(0,clusterIdx.size>0?1:0)+'</div></div>';
}

function chipsHtml(idxSet,cls){
  var arr=[];idxSet.forEach(function(i){arr.push(WHEEL[i]);});
  arr.sort(function(a,b){return a-b;});
  return arr.map(function(n){return '<span class="chip '+cls+'">'+n+'</span>';}).join('');
}

function buildAposta(clusterIdx,nbrIdx,mirrorIdx,mirNbrIdx,isolatedIdx,minC){
  var el=document.getElementById('aposta');
  if(clusterIdx.size===0){
    var iso=[];isolatedIdx.forEach(function(i){iso.push(WHEEL[i]);});
    el.innerHTML='<div class="aposta-title">⚠️ Nenhum cluster encontrado</div>'+
      (iso.length>0?'<p style="font-size:13px;color:#888;">Isolados: '+iso.join(', ')+'<br>Tente reduzir o raio mínimo para 1.</p>':'<p style="font-size:13px;color:#888;">Insira o histórico e clique em Analisar.</p>');
    return;
  }

  var all=new Set();
  clusterIdx.forEach(function(i){all.add(i);});
  nbrIdx.forEach(function(i){all.add(i);});
  mirrorIdx.forEach(function(i){all.add(i);});
  mirNbrIdx.forEach(function(i){all.add(i);});
  var allNums=[];all.forEach(function(i){allNums.push(WHEEL[i]);});
  allNums.sort(function(a,b){return a-b;});

  var iso=[];isolatedIdx.forEach(function(i){iso.push(WHEEL[i]);});

  var html='<div class="aposta-title">📍 Onde apostar agora</div>';
  html+='<div class="chips">'+chipsHtml(clusterIdx,'chip ch')+chipsHtml(nbrIdx,'chip cn')+chipsHtml(mirrorIdx,'chip cm')+chipsHtml(mirNbrIdx,'chip cmn')+'</div>';
  html+='<div class="sec-t">🔴 Cluster quente ('+clusterIdx.size+')</div><div class="chips">'+chipsHtml(clusterIdx,'chip ch')+'</div>';
  html+='<div class="sec-t">🟠 Vizinhos do cluster ('+nbrIdx.size+')</div><div class="chips">'+chipsHtml(nbrIdx,'chip cn')+'</div>';
  html+='<div class="sec-t">🔵 Espelhos ('+mirrorIdx.size+')</div><div class="chips">'+chipsHtml(mirrorIdx,'chip cm')+'</div>';
  html+='<div class="sec-t">🟣 Vizinhos dos espelhos ('+mirNbrIdx.size+')</div><div class="chips">'+chipsHtml(mirNbrIdx,'chip cmn')+'</div>';
  if(iso.length>0)html+='<div class="sec-t">⚫ Ignorados: '+iso.join(', ')+'</div>';
  html+='<div class="total-box"><strong>Total a apostar:</strong> '+allNums.join(', ')+'<br><strong>Cobertura:</strong> '+((all.size/37)*100).toFixed(1)+'% do cilindro</div>';
  el.innerHTML=html;
}

function limpar(){
  document.getElementById('hist').value='';
  document.getElementById('stats').innerHTML='';
  document.getElementById('aposta').innerHTML='';
  var canvas=document.getElementById('c');
  var ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
}

// Service Worker
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}

render();
</script>
</body>
</html>
